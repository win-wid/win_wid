<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İdarə Mərkəzi - Polis Sistemi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #4CAF50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #333; }
        th { background-color: #333; color: #4CAF50; }
        tr:hover { background-color: #2a2a2a; }
        a { color: #4CAF50; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn-back { display: inline-block; margin-bottom: 15px; padding: 8px 15px; background: #333; color: #fff; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="{{ url_for('index') }}" class="btn-back">← Əsas səhifəyə qayıt</a>
        <h2>İdarə Mərkəzi - Polis Əməkdaşları</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>İstifadəçi adı</th>
                    <th>Rütbə</th>
                    <th>Alay</th>
                    <th>Qeydiyyat tarixi</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                {% for officer in officers %}
                <tr>
                    <td>{{ officer[0] }}</td>
                    <td><a href="{{ url_for('police_profile', officer_id=officer[0]) }}">{{ officer[1] }}</a></td>
                    <td>{{ officer[2] }}</td>
                    <td>{{ officer[3] }}</td>
                    <td>{{ officer[4] }}</td>
                    <td>{{ 'Aktiv' if officer[5] else 'Deaktiv' }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
