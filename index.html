<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win_Wid Social Platform</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { background-color: #0088cc; color: white; font-weight: bold; cursor: pointer; }
        .chat-box { background: #1e1e1e; height: 300px; overflow-y: auto; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #333; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        .msg-item { margin: 5px 0; padding: 5px; border-bottom: 1px solid #2a2a2a; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Win_Wid Social Platform</h2>
        
        <div class="card" id="auth-box">
            <h3>Giriş / Qeydiyyat</h3>
            <input type="text" id="username" placeholder="İstifadəçi adı">
            <input type="password" id="password" placeholder="Şifrə">
            <button onclick="register()">Qeydiyyatdan Keç</button>
        </div>

        <div class="card">
            <h3>Canlı Çat</h3>
            <div class="chat-box" id="chat"></div>
            <input type="text" id="msg" placeholder="Mesaj yazın...">
            <button onclick="sendMessage()">Göndər</button>
        </div>
    </div>

    <script>
        const socket = io();

        socket.on('receive_global_message', data => {
            const chat = document.getElementById('chat');
            chat.innerHTML += `<div class="msg-item"><b>${data.userId}:</b> ${data.message}</div>`;
            chat.scrollTop = chat.scrollHeight;
        });

        socket.on('error_message', msg => {
            alert(msg);
        });

        function sendMessage() {
            const msgInput = document.getElementById('msg');
            const msg = msgInput.value.trim();
            if (msg) {
                socket.emit('send_global_message', { userId: 'İstifadəçi', message: msg });
                msgInput.value = '';
            }
        }

        async function register() {
            alert("Hesab yaradıldı!");
        }
    </script>
</body>
  </html>
